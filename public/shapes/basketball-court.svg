    <circle cx="144" cy="180" r="36"/>
    <!-- Left restricted / hoop area -->
    <path d="M48 132 A 60 60 0 0 1 48 228"/>
    <circle cx="72" cy="180" r="8" fill="#fff" stroke="none"/>
    <!-- Right key / paint -->
    <rect x="496" y="108" width="96" height="144"/>
