  <rect x="40" y="40" width="560" height="280" rx="4" fill="#fff"/>
  <rect x="48" y="48" width="544" height="264" fill="#111"/>
  <g fill="none" stroke="#fff" stroke-width="4">
    <!-- Outer boundary -->
    <rect x="48" y="48" width="544" height="264"/>
    <!-- Center line -->
    <line x1="320" y1="48" x2="320" y2="312"/>
    <!-- Center circle -->
    <circle cx="320" cy="180" r="36"/>
    <!-- Left key / paint -->
    <rect x="48" y="108" width="96" height="144"/>
