    <circle cx="496" cy="180" r="36"/>
    <!-- Right restricted / hoop area -->
    <path d="M592 132 A 60 60 0 0 0 592 228"/>
    <circle cx="568" cy="180" r="8" fill="#fff" stroke="none"/>
    <!-- Three-point arcs -->
    <path d="M48 72 L96 72 A120 120 0 0 1 96 288 L48 288"/>
    <path d="M592 72 L544 72 A120 120 0 0 0 544 288 L592 288"/>
