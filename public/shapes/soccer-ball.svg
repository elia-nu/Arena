<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000"/>
  <g fill="#fff" transform="translate(256 256)">
    <!-- Outer ball -->
    <circle r="200" fill="#fff"/>
    <!-- Classic soccer hex/pent pattern (dark cutouts so luminance forms seams) -->
    <g fill="#000">
      <!-- Center pentagon -->
      <path d="M0,-70 L66.5,-22.5 L41.2,56.5 L-41.2,56.5 L-66.5,-22.5 Z"/>
      <!-- Surrounding hexes as darker panels via overlapping arcs -->
      <path d="M0,-70 L66.5,-22.5 L100,-90 L50,-150 L-50,-150 L-100,-90 L-66.5,-22.5 Z" opacity="0.15"/>
      <path d="M66.5,-22.5 L41.2,56.5 L120,70 L160,-10 L100,-90 Z" opacity="0.2"/>
      <path d="M41.2,56.5 L-41.2,56.5 L-50,140 L50,140 L120,70 Z" opacity="0.25"/>
      <path d="M-41.2,56.5 L-66.5,-22.5 L-100,-90 L-160,-10 L-120,70 Z" opacity="0.2"/>
      <path d="M-66.5,-22.5 L0,-70 L50,-150 L-50,-150 L-100,-90 Z" opacity="0.18"/>
    </g>
    <!-- Seam lines -->
    <g fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round">
      <path d="M0,-70 L66.5,-22.5 L41.2,56.5 L-41.2,56.5 L-66.5,-22.5 Z"/>
      <path d="M0,-70 L0,-200"/>
      <path d="M66.5,-22.5 L180,-70"/>
      <path d="M41.2,56.5 L130,160"/>
      <path d="M-41.2,56.5 L-130,160"/>
      <path d="M-66.5,-22.5 L-180,-70"/>
      <path d="M0,-200 C80,-185 145,-140 180,-70"/>
      <path d="M180,-70 C195,10 175,100 130,160"/>
      <path d="M130,160 C70,195 -70,195 -130,160"/>
      <path d="M-130,160 C-175,100 -195,10 -180,-70"/>
      <path d="M-180,-70 C-145,-140 -80,-185 0,-200"/>
    </g>
  </g>
</svg>
